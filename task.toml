artifacts = ["/workspace/dist", "/workspace/src"]

[task]
name = "afterquery/offline-sync"

[metadata]
author_name = "Kibet Brian"
author_email = "kibetbrian@example.com"
difficulty_explanation = "Field-service and clinical-tools engineers build exactly this kind of offline-first mutation log, where each sync rule is simple alone but their combination across reloads defeats partial fixes. The scaffold is a compiling starting point with a naive last-write-wins engine, a single-record editor, and a passive adapter; it has no test ids, no adapter hooks, no delete support, and no server snapshot. The agent must build everything the spec demands: durable server snapshots with monotonic op IDs, three-way field merges with sorted conflicts, tombstone delete/restore mutations whose flag disagreements always yield one 'deleted' conflict, client-created records with temporary ids remapped on acceptance, idempotent and out-of-order ack handling with full-queue replay, sticky error flags, and reload recovery. The verifier serves the built bundle in headless Chromium and steps scripted plus seeded-random event sequences through the app and an independent Python model, comparing canonical state after every event, so only a genuinely correct engine passes."
solution_explanation = "Persist display records plus a server snapshot and monotonic op log. Local edits diff only changed fields and never clear conflicts. Delete/restore mutations flip a durable deleted flag that merges as a field, except delete-vs-edit clashes yield one 'deleted'/'present' conflict. Remote/stale events run a three-way merge against the previous server snapshot: single-side changes merge, same-field disagreement creates sorted conflicts. Acks are idempotent and replay every remaining op for the record in ID order; failures leave ops pending with a sticky error flag cleared only by new edits; connectivity aborts in-flight markers; reload rebuilds from storage and resends the head op."
verification_explanation = "tests/test.sh runs pytest, which launches headless Chromium against /workspace/dist served over local HTTP. Each test drives deterministic event sequences into both the app (UI edits, deletes, restores and resolutions via documented test ids, adapter injections for ack/stale/remote/failure/connectivity, real page reloads with readiness waits) and the independent Python reference model in tests/, then asserts deep equality of records, versions, pending projection, conflicts, and status after every step, including delete-vs-edit conflict tests in both directions, stale flips of pending deletes and restores, reload with a live delete conflict, no-op resolutions, conflict refresh without duplicates, out-of-order delete acks, accepted deletes dropping agreed delete conflicts, created-record acceptance with id remapping, failure and duplicate acks on creations, reverse-order drains, offline creation chains, and a 100-step seeded-random sequence with deletes, restores and reloads the agent cannot predict. No app source is read and no identifiers are checked, so only behaviorally correct sync scores 1; a missing bundle fails every browser test, so doing nothing scores 0. Reward 1 requires all tests green, written to /logs/verifier/reward.txt with a CTRF report."
category = "Software"
subcategory = "Frontend"
tags = ["frontend", "sync", "offline", "typescript"]
expert_time_estimate_hours = 20
relevant_experience = "Built offline-first data sync for field tools with local op logs, conflict queues, and flaky-network retry semantics."

